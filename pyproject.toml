[project]
name = "hakai-metadata-conversion"
version = "0.1.0"
description = ""
authors = [
    {name = "Jessy Barrette", email = "30420025+JessyBarrette@users.noreply.github.com"},
]
requires-python = "<4.0,>=3.11"
readme = "README.md"
dependencies = [
    "loguru>=0.7.2,<0.8",
    "requests>=2.32.3,<3",
    "pycountry>=24.6.1,<25",
    "pyyaml>=6.0.1,<7",
    "lxml>=6.1.0,<7",
    "metadata-xml @ git+https://github.com/hakaiinstitute/metadata-xml.git",
    "click>=7,<9",
    "datacite>=1.2.0",
    "python-dotenv>=1.1.0",
    "google-auth>=2.40.3",
    "google-oauth>=1.0.1",
    "duckdb>=1.0.0",
    "deepdiff>=8.6.1",
    # Security floors for transitive dependencies. These are not imported
    # directly; they are named here because uv.lock on its own did not survive a
    # merge - reseeding the lock from the upstream branch took certifi back from
    # 2026.10.23 to 2025.8.3, silently undoing the eMudhra emSign CA fix in
    # 6ee9be5. A floor here cannot be reverted by a resolver.
    "certifi>=2026.10.23",
    "urllib3>=2.8.0",
    "pyasn1>=0.6.4",
    "pyopenssl>=26.0.0",
]

[project.scripts]
hakai_metadata_conversion = "hakai_metadata_conversion.__main__:cli"

[dependency-groups]
dev = [
    "pytest<9.0.0,>=8.2.2",
    "isort<6.0.0,>=5.13.2",
    "ruff<1.0.0,>=0.5.0",
    "black<25.0.0,>=24.4.2",
    "pytest-xdist<4.0.0,>=3.6.1",
    "pytest-dependency>=0.6",
    "flake8>=7.3.0",
]
docs = [
    "black<25.0.0,>=24.4.2",
]

[tool.pytest.ini_options]
markers = [
    "core: core tests that test the application",
    "metadataFiles: test that convert metadata files from the file repo",
    "live: test reaches out to a live external API (OBIS, DataCite); not stubbed",
    "integration: tests that call external APIs (DataCite test API)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Allow the metadata-xml git direct reference in project.dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hakai_metadata_conversion"]
# `packages` already ships tracked non-Python files under the package directory,
# which is what puts the resources/ vocabularies in the wheel today. `artifacts`
# is purely additive on top of that: it force-includes files that would
# otherwise be excluded because git IGNORES them. It never filters anything, so
# the glob covers every extension rather than just *.json.
artifacts = ["hakai_metadata_conversion/resources/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["hakai_metadata_conversion/resources/*"]
