name: Run Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: "."
          persist-credentials: false
      - name: Checkout hakai metadata filesxz
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: HakaiInstitute/hakai-metadata-entry-form-files
          path: ./tests/records/hakai-metadata-entry-form-files
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev

      - name: Lint Tests
        shell: bash -l {0}
        run: |
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .venv
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude .venv
      - name: Run tests
        run: |
          uv run pytest tests/

      # pytest runs against an editable install, so Path(__file__) always
      # resolves into the source tree and hatchling's file-selection rules are
      # never exercised. Without this step a resources/ file that is missing
      # from the wheel — because it was never git-added, or because a glob
      # stopped matching it — passes every test and only breaks on install.
      - name: Check bundled resources are in the wheel
        run: |
          uv build --wheel
          uv run python - <<'PY'
          import glob
          import sys
          import zipfile

          required = [
              "obis_mapping.yaml",
              "eov_to_keywords.yaml",
              "eov.json",
              "epsg.json",
              "licenses.json",
              "platforms.json",
          ]
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          shipped = set(zipfile.ZipFile(wheel).namelist())
          missing = [
              name
              for name in required
              if f"hakai_metadata_conversion/resources/{name}" not in shipped
          ]
          if missing:
              sys.exit(f"{wheel} is missing resources: {missing}")
          print(f"{wheel}: all {len(required)} bundled resources present")
          PY

      - name: Convert test record to CITATION.cff if main branch
        # The action from this checkout rather than hakaiinstitute/...@main, so the
        # step exercises the code under test instead of whatever main points at.
        uses: ./
        if: github.ref == 'refs/heads/main'
        with:
          input: tests/records/test_record1.json
          output-file: CITATION.cff
          output-format: cff
          commit: false

      # re-deploy the metadata web app on caprover as it uses this repo
      # go to hakai-metadata-entry-form repo and run Build and Deploy Metadata Generator Docker Image action
